name: Scrape DBL Stats

on:
  workflow_dispatch:          # handmatig starten
  schedule:
    - cron: '0 7 * * 1,4'    # elke maandag + donderdag om 07:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: |
          pip install playwright
          playwright install chromium

      - name: Scraper uitvoeren
        run: python scraper.py --outdir data

      - name: JSON bestanden committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/splits.json data/meta.json
          git diff --cached --quiet || git commit -m "stats: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
